name: Manual Hugging Face live inference

on:
  workflow_dispatch:
    inputs:
      acknowledge_provider_charges:
        description: "I understand this makes a live provider call that may consume credits"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-smoke-test:
    if: ${{ inputs.acknowledge_provider_charges }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_LIVE_INFERENCE: '1'
      RUN_HF_LIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install live agent dependencies
        run: python -m pip install -e ".[agents]"
      - name: Run one bounded live tool-calling smoke test
        run: python -m unittest discover -s tests_live -v
