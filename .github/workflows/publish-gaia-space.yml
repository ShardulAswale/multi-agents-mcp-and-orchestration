name: Publish GAIA Space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Existing public Hugging Face Space (username/space-name)"
        required: true
        type: string
      confirm_public_space:
        description: "Publish code to this public Space; no inference or submission"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm_public_space }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: ${{ inputs.space_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate target and token
        run: |
          if [[ ! "$SPACE_ID" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "Expected an existing username/space-name" >&2
            exit 1
          fi
          if [[ -z "$HF_TOKEN" ]]; then
            echo "Configure the HF_TOKEN GitHub secret with Space write access" >&2
            exit 1
          fi
      - name: Install Hugging Face CLI
        run: python -m pip install 'huggingface_hub>=1,<3'
      - name: Publish project folder to Space root
        run: hf upload "$SPACE_ID" projects/gaia-final-agent . --repo-type space --commit-message "Publish GAIA Unit 4 app from GitHub"
