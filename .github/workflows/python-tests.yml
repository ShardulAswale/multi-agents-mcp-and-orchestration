name: Python lesson tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project metadata
        run: python -m pip install -e .
      - name: Run standard library regression tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax and imports
        run: python -m compileall -q challenges lessons projects tests

  smolagents-compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the implemented Unit 2.1 dependency
        run: python -m pip install -e ".[agents]"
      - name: Test tools and agent construction without inference
        run: python -m unittest discover -s tests_agents -v
      - name: Run the local smolagents tool example
        run: python challenges/00-first-tool/smolagents_tool.py
