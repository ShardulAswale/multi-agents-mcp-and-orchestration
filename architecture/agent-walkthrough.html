<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agent Architecture — Progressive Walkthrough</title>
<style>
body{font:16px system-ui,sans-serif;background:#101827;color:#eaf0f9;margin:0;padding:28px}main{max-width:850px;margin:auto}h1{font-size:1.7rem}p{line-height:1.55;color:#b9c7d8}.stage{color:#8dd7ff;font-weight:700}.diagram{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:190px;margin:20px 0;padding:20px;border:1px solid #34445e;border-radius:16px;background:#192438}.node{padding:15px;border-radius:10px;background:#26486a;border:1px solid #4d83b0;animation:enter .45s ease both}.arrow{color:#a4c9f0;font-size:22px;animation:enter .45s ease both}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{background:#3184c5;border:0;color:white;padding:12px 20px;border-radius:9px;cursor:pointer;font-weight:700}button:disabled{opacity:.35;cursor:default}.note{margin-top:20px}.legend{font-size:.9rem;color:#aebdd1}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.node,.arrow{animation:none}}
</style></head><body><main><h1>Building AI agents: from simple to complex</h1><p>Advance through five architecture stages. Each adds new responsibilities without losing the previous design principles.</p><div class="stage" id="stage"></div><h2 id="heading"></h2><div class="diagram" id="diagram" aria-live="polite"></div><p id="explanation"></p><div class="controls"><button id="prev">Previous</button><button id="next">Next stage</button><span id="counter"></span></div><p class="note">This is a conceptual animation. It does not execute agent code or call external APIs.</p></main>
<script>
const stages=[
{title:"Single tool",nodes:["User","LLM","Python tool","Answer"],text:"The model interprets a request and invokes one tool. Start by learning tool signatures and observations."},
{title:"Validation and ranking",nodes:["User","LLM","Search","Validate","Filter","Rank","Explain"],text:"Deterministic Python enforces constraints and ranks eligible flights before the model explains them."},
{title:"Reliability and approval",nodes:["Request","LLM","Tool","Error handling","Bounded retry","Validate","Human approval"],text:"Add safe retry policies, error classification, and explicit approval for consequential actions."},
{title:"Memory and planning",nodes:["Request","Planner","Memory retrieval","Tools","Observation","Replan","Answer"],text:"Add relevant memory, planning, and feedback loops. Persistent storage requires appropriate consent and controls."},
{title:"Multi-agent orchestration",nodes:["User","Orchestrator","Specialist agents","Validation","Evaluation","Traces","Answer"],text:"Introduce specialist agents, metrics and observability only when their extra cost and complexity are justified."}
];let index=0;function render(){const s=stages[index];document.getElementById("stage").textContent="STAGE "+(index+1);document.getElementById("heading").textContent=s.title;const d=document.getElementById("diagram");d.replaceChildren();s.nodes.forEach((name,i)=>{if(i){const a=document.createElement("span");a.className="arrow";a.textContent="→";a.style.animationDelay=(i*90)+"ms";d.appendChild(a)}const n=document.createElement("span");n.className="node";n.textContent=name;n.style.animationDelay=(i*90)+"ms";d.appendChild(n)});document.getElementById("explanation").textContent=s.text;document.getElementById("counter").textContent=(index+1)+" / "+stages.length;document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index===stages.length-1}document.getElementById("prev").onclick=()=>{index--;render()};document.getElementById("next").onclick=()=>{index++;render()};render();
</script></body></html>
